name: NPM vulnerability remediation

on:
  workflow_dispatch:
    inputs:
      max_prs:
        description: Maximum remediation PRs to create (blank uses VULNERABILITY_MAX_PRS or 3)
        required: false
        default: "3"
  schedule:
    # Every weekday at 06:15 UTC. Adjust to your vulnerability-response SLA.
    - cron: '15 6 * * 1-5'

# This workflow can create branches and pull requests, but it never merges them.
permissions:
  contents: write
  pull-requests: write

# Each execution creates a small, configurable PR batch. Queue runs instead of cancelling them
# so a newly published advisory is considered after an in-progress remediation.
concurrency:
  group: npm-audit-remediation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Create npm-audit remediation PRs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install semver globally
        run: npm install -g semver

      - name: Find and remediate one vulnerability
        run: node .github/scripts/vulPilot.js
        env:
          # GitHub creates this short-lived token for the job. It is used only
          # to look for an existing PR and to create a new one.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REMEDIATION_BASE: ${{ github.event.repository.default_branch || github.ref_name }}
          MAX_PRS: ${{ github.event.inputs.max_prs || vars.VULNERABILITY_MAX_PRS || '3' }}
          # Optional repository variable; separate commands with newlines.
          # Example: npm test\nnpm run lint\nnpm run build
          REMEDIATION_VALIDATION: ${{ vars.REMEDIATION_VALIDATION }}
